# bind=Alt,6,tag,6,0
# bind=Alt,7,tag,7,0
# bind=Alt,8,tag,8,0
# bind=Alt,9,tag,9,0

bind=SHIFT+SUPER,1,toggletag,1
bind=SHIFT+SUPER,2,toggletag,2
bind=SHIFT+SUPER,3,toggletag,3
bind=SHIFT+SUPER,4,toggletag,4
bind=SHIFT+SUPER,5,toggletag,5
bind=SHIFT+SUPER,6,toggletag,6
bind=SHIFT+SUPER,7,toggletag,7
bind=SHIFT+SUPER,8,toggletag,8
bind=SHIFT+SUPER,9,toggletag,9

bind=CTRL+SUPER,1,toggleview,1
bind=CTRL+SUPER,2,toggleview,2
bind=CTRL+SUPER,3,toggleview,3
bind=CTRL+SUPER,4,toggleview,4
bind=CTRL+SUPER,5,toggleview,5
bind=CTRL+SUPER,6,toggleview,6
bind=CTRL+SUPER,7,toggleview,7
bind=CTRL+SUPER,8,toggleview,8
bind=CTRL+SUPER,9,toggleview,9

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=alt+shift,Up,focusmon,up
bind=alt+shift,Down,focusmon,down
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
bind=SUPER+Alt,Up,tagmon,up
bind=SUPER+Alt,Down,tagmon,down
bind=SUPER,Home,focusmon,DP-1
bind=SUPER,End,focusmon,eDP-1
bind=SUPER+SHIFT,Home,tagmon,DP-1
bind=SUPER+SHIFT,End,tagmon,eDP-1

# gaps
# bind=ALT+SHIFT,X,incgaps,1
# bind=ALT+SHIFT,Z,incgaps,-1
# bind=ALT+SHIFT,R,togglegaps


# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=alt,btn_middle,set_proportion,0.5
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen
# mousebind=NONE,btn_middle,togglemaximizescreen,0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
# axisbind=alt,UP,focusdir,left
# axisbind=alt,DOWN,focusdir,right
axisbind=shift+super,UP,exchange_client,left
axisbind=shift+super,DOWN,exchange_client,right

# Gesturebind
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1



#custom app bind
# bind=SUPER,Return,spawn,google-chrome
bind=CTRL+SUPER,Return,spawn,wezterm -e yazi
bind=CTRL+ALT,a,spawn_shell,grim -g "$(slurp -b '#2E2A1E55' -c '#fb751bff')" -t ppm - | satty -f -
# bind=SUPER,h,spawn,bash ~/.config/mango/scripts/hide_waybar_mango.sh

bind=SUPER,v,spawn,wl-paste | echo



### Noctalia binds
bind=ALT,space,spawn,rofi -show drun # Backup launcher
bind=SUPER,space,spawn,dms ipc call launcher toggle
bind=SUPER+CTRL,comma,spawn,dms ipc call settings toggle
bind=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 5%
bind=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 5%
bind=NONE,XF86AudioMute,spawn,dms ipc call audio mute
### BUG: Can go below 0, use brightnessctl instead
# bind=NONE,XF86MonBrightnessUp,spawn,noctalia-shell ipc call brightness increase
# bind=NONE,XF86MonBrightnessDown,spawn,noctalia-shell ipc call brightness decrease
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=SUPER,0,spawn,dms ipc call lock lock
bind=SHIFT+SUPER,0,spawn,dms ipc call powermenu toggle


