# reload config
bind=SUPER,r,spawn_shell,bash ~/.config/mango/scripts/config_check.sh
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,return,spawn,ghostty --working-directory=~
bind=Alt,Return,spawn,foot # Keep for safety, to be able to spawn terminal

bind=SUPER+SHIFT,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left,0
bind=SUPER,Right,focusdir,right,0
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER,o,toggleoverview,

# Tag switching
bind=SUPER,Prior,viewtoleft
bind=SUPER,Next,viewtoright
bind=SUPER,u,viewtoleft
bind=SUPER,d,viewtoright
bind=SUPER,b,view,-1 # Back-and-forth
# Press multiple numbers at once to combine views
bind=SUPER,1,comboview,1
bind=SUPER,2,comboview,2
bind=SUPER,3,comboview,3
bind=SUPER,4,comboview,4
bind=SUPER,5,comboview,5
bind=SUPER,6,comboview,6
bind=SUPER,7,comboview,7
bind=SUPER,8,comboview,8
bind=SUPER,9,comboview,9

bind=SHIFT+SUPER,1,tag,1
bind=SHIFT+SUPER,2,tag,2
bind=SHIFT+SUPER,3,tag,3
bind=SHIFT+SUPER,4,tag,4
bind=SHIFT+SUPER,5,tag,5
bind=SHIFT+SUPER,6,tag,6
bind=SHIFT+SUPER,7,tag,7
bind=SHIFT+SUPER,8,tag,8
bind=SHIFT+SUPER,9,tag,9

bind=CTRL+SUPER,1,toggleview,1
bind=CTRL+SUPER,2,toggleview,2
bind=CTRL+SUPER,3,toggleview,3
bind=CTRL+SUPER,4,toggleview,4
bind=CTRL+SUPER,5,toggleview,5
bind=CTRL+SUPER,6,toggleview,6
bind=CTRL+SUPER,7,toggleview,7
bind=CTRL+SUPER,8,toggleview,8
bind=CTRL+SUPER,9,toggleview,9

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=alt+shift,Up,focusmon,up
bind=alt+shift,Down,focusmon,down
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
bind=SUPER+Alt,Up,tagmon,up
bind=SUPER+Alt,Down,tagmon,down
bind=SUPER,Home,focusmon,left
bind=SUPER,End,focusmon,right
bind=SUPER+SHIFT,Home,tagmon,left
bind=SUPER+SHIFT,End,tagmon,right

# Gesturebind
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1

### DMS binds
# Launching
bind=ALT,space,spawn,rofi -show drun # Backup launcher
bind=SUPER,space,spawn,dms ipc call launcher toggle
bind=SUPER+CTRL,comma,spawn,dms ipc call settings toggle
# Audio
bind=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 5%
bind=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 5%
bind=NONE,XF86AudioMute,spawn,dms ipc call audio mute
# Brightness
bind=NONE,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 10% ""
bind=NONE,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 10% ""
# Power-menu
bind=SUPER,0,spawn,dms ipc call lock lock
bind=SHIFT+SUPER,0,spawn,dms ipc call powermenu toggle
# Screenshot
bind=SUPER+SHIFT,s,spawn,dms screenshot --no-file
bind=SUPER+CTRL,s,spawn_shell,grim -g "$(slurp -b '#2E2A1E55' -c '#fb751bff')" -t ppm - | satty -f -
# Clipboard
bind=SUPER,v,spawn,dms ipc call clipboard toggle


### Lid-operations
# NOTE: `dms` command needs to be last, as it hangs until unlocking
# switchbind=fold,spawn_shell,mmsg dispatch disable_monitor,eDP-1;dms ipc call lock lock
switchbind=fold,disable_monitor,eDP-1
switchbind=unfold,enable_monitor,eDP-1


### Scratchpads
windowrule=isnamedscratchpad:1,width:1600,height:1200,appid:scratch.yazi
bind=SUPER,y,toggle_named_scratchpad,scratch.yazi,none,ghostty --class=scratch.yazi -e yazi
windowrule=isnamedscratchpad:1,width:1600,height:1200,appid:scratch.term
bind=SUPER,z,toggle_named_scratchpad,scratch.term,none,ghostty --class=scratch.term
